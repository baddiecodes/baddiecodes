<svg xmlns="http://www.w3.org/2000/svg" width="500" height="530" viewBox="0 0 500 530" role="img" aria-label="ASCII fox portrait loading animation">
  <defs>
    <clipPath id="foxReveal">
      <rect x="0" y="0" width="500" height="0">
        <animate
          attributeName="height"
          dur="1.8s"
          begin="0s"
          fill="freeze"
          calcMode="discrete"
          values="0;28;62;110;168;238;320;410;530"
          keyTimes="0;0.10;0.20;0.34;0.48;0.62;0.76;0.90;1" />
      </rect>
    </clipPath>

    <linearGradient id="scanFade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C59BFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="500" height="530" fill="#FFF8EF"/>

  <!-- faint pre-load ghost -->
  <image
    href="https://raw.githubusercontent.com/baddiecodes/baddiecodes/main/assets/ascii-fox.png"
    x="0" y="0" width="500" height="530"
    opacity="0.08"
    preserveAspectRatio="xMidYMid meet" />

  <!-- main fox reveal -->
  <image
    href="https://raw.githubusercontent.com/baddiecodes/baddiecodes/main/assets/ascii-fox.png"
    x="0" y="0" width="500" height="530"
    clip-path="url(#foxReveal)"
    preserveAspectRatio="xMidYMid meet">
    <animate attributeName="opacity" dur="1.8s" values="0;0.35;0.55;0.75;1" keyTimes="0;0.22;0.48;0.72;1" fill="freeze" />
  </image>

  <!-- scan line -->
  <rect x="22" y="-70" width="456" height="70" rx="10" fill="url(#scanFade)" opacity="0.9" filter="url(#softGlow)">
    <animate attributeName="y" dur="1.8s" values="-70;-20;40;110;190;280;380;470;560" keyTimes="0;0.10;0.20;0.34;0.48;0.62;0.76;0.90;1" fill="freeze" />
    <animate attributeName="opacity" dur="1.8s" values="0;0.8;0.8;0.8;0.7;0.6;0.45;0.2;0" keyTimes="0;0.08;0.20;0.40;0.60;0.76;0.88;0.96;1" fill="freeze" />
  </rect>

  <!-- loading label -->
  <text x="250" y="42" text-anchor="middle" font-family="Space Mono, monospace" font-size="13" letter-spacing="3" fill="#8E72B8" opacity="0.95">
    LOADING IDENTITY
    <animate attributeName="opacity" dur="1.8s" values="1;1;1;0" keyTimes="0;0.72;0.88;1" fill="freeze" />
  </text>

  <!-- subtle pulse after load -->
  <rect x="0" y="0" width="500" height="530" fill="#C59BFF" opacity="0">
    <animate attributeName="opacity" begin="1.65s" dur="0.35s" values="0;0.06;0" fill="freeze" />
  </rect>
</svg>
